# Basic settings for OpenCart application
<Directory "/var/www/upload">
    # Enable .htaccess file processing
    AllowOverride All

    # Basic access permissions
    Options Indexes FollowSymLinks
    Require all granted
</Directory>

# Basic security rules (additional to .htaccess)
<Files ~ "^\.">
    Require all denied
</Files>

<Files ~ "config\.php$">
    Require all denied
</Files>

# Development: never let browsers reuse source files. Catches stale ES modules
# (e.g. a cached webcomponent.js) after an edit without a hard refresh.
<IfModule mod_headers.c>
    <FilesMatch "\.(html|js|css|json)$">
        Header always set Cache-Control "no-store, no-cache, must-revalidate, max-age=0"
        Header always set Pragma "no-cache"
        Header always set Expires "0"
    </FilesMatch>
</IfModule>
