# Solo los archivos que tocan las 6 funcionalidades (los mismos de los
# diagramas de flujo y los grafos):
#   RF-06 - Busqueda y filtrado de productos
#   RF-07 - Carrito de compras
#   RF-08 - Cupones de descuento
#   RF-09 - Resenas de productos
#   RF-10 - Comparar productos
#   RF-11 - Devoluciones
#
# Nota: SonarQube filtra por archivo, no por funcion. catalog/model/catalog/product.php
# trae tambien la ficha del producto y los productos relacionados, y
# system/library/cart/cart.php lo usa todo el checkout: quedan completos.
sonar.inclusions=\
  upload/catalog/controller/product/search.php,\
  upload/catalog/model/catalog/product.php,\
  upload/catalog/view/template/product/search.twig,\
  upload/catalog/controller/checkout/cart.php,\
  upload/system/library/cart/cart.php,\
  upload/catalog/view/template/checkout/cart.twig,\
  upload/catalog/view/template/checkout/cart_list.twig,\
  upload/extension/opencart/catalog/controller/checkout/coupon.php,\
  upload/extension/opencart/catalog/model/total/coupon.php,\
  upload/extension/opencart/catalog/view/template/checkout/coupon.twig,\
  upload/admin/controller/marketing/coupon.php,\
  upload/admin/model/marketing/coupon.php,\
  upload/catalog/controller/product/review.php,\
  upload/catalog/model/catalog/review.php,\
  upload/catalog/view/template/product/review.twig,\
  upload/catalog/view/template/product/review_list.twig,\
  upload/admin/controller/catalog/review.php,\
  upload/admin/model/catalog/review.php,\
  upload/catalog/controller/product/compare.php,\
  upload/catalog/view/template/product/compare.twig,\
  upload/catalog/controller/account/returns.php,\
  upload/catalog/model/account/returns.php,\
  upload/catalog/view/template/account/returns_form.twig,\
  upload/admin/controller/sale/returns.php,\
  upload/admin/model/sale/returns.php

sonar.exclusions=upload/system/storage/vendor/**,upload/image/**,upload/install/**
