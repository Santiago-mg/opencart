sonar.projectKey=OpenCart-Santiago
sonar.host.url=http://localhost:9000
sonar.projectName=OpenCart 4.1.0.3 - Funcionalidades Santiago (RF-06 a RF-11)
sonar.projectVersion=4.1.0.3-pruebas
sonar.sourceEncoding=UTF-8

sonar.sources=upload

# Solo los archivos que tocan las funcionalidades probadas (los mismos de los
# diagramas de flujo y los grafos). Todo lo demas de OpenCart queda aislado
# (fuera del analisis) porque no tiene pruebas:
#   RF-06 - Busqueda y filtrado de productos
#   RF-07 - Carrito de compras
#   RF-08 - Cupones de descuento
#   RF-09 - Resenas de productos
#   RF-10 - Comparar productos
#   RF-11 - Devoluciones
#   RF-01 a RF-05 (Andres) - Filtro de pedidos, idiomas, monedas,
#                            zonas geograficas e impuestos, registros
#
# Nota: SonarQube filtra por archivo, no por funcion. catalog/model/catalog/product.php
# trae tambien la ficha del producto y los productos relacionados, y
# system/library/cart/cart.php lo usa todo el checkout: quedan completos.
sonar.inclusions=\
  upload/catalog/controller/product/search.php,\
  upload/catalog/model/catalog/product.php,\
  upload/catalog/view/template/product/search.twig,\
  upload/catalog/controller/checkout/cart.php,\
  upload/system/library/cart/cart.php,\
  upload/catalog/view/template/checkout/cart.twig,\
  upload/catalog/view/template/checkout/cart_list.twig,\
  upload/extension/opencart/catalog/controller/checkout/coupon.php,\
  upload/extension/opencart/catalog/model/total/coupon.php,\
  upload/extension/opencart/catalog/view/template/checkout/coupon.twig,\
  upload/admin/controller/marketing/coupon.php,\
  upload/admin/model/marketing/coupon.php,\
  upload/catalog/controller/product/review.php,\
  upload/catalog/model/catalog/review.php,\
  upload/catalog/view/template/product/review.twig,\
  upload/catalog/view/template/product/review_list.twig,\
  upload/admin/controller/catalog/review.php,\
  upload/admin/model/catalog/review.php,\
  upload/catalog/controller/product/compare.php,\
  upload/catalog/view/template/product/compare.twig,\
  upload/catalog/controller/account/returns.php,\
  upload/catalog/model/account/returns.php,\
  upload/catalog/view/template/account/returns_form.twig,\
  upload/admin/controller/sale/returns.php,\
  upload/admin/model/sale/returns.php,\
  upload/admin/controller/sale/order.php,\
  upload/admin/model/sale/order.php,\
  upload/admin/view/template/sale/order*.twig,\
  upload/admin/controller/localisation/language.php,\
  upload/admin/model/localisation/language.php,\
  upload/admin/view/template/localisation/language*.twig,\
  upload/admin/controller/localisation/currency.php,\
  upload/admin/model/localisation/currency.php,\
  upload/admin/view/template/localisation/currency*.twig,\
  upload/admin/controller/localisation/geo_zone.php,\
  upload/admin/model/localisation/geo_zone.php,\
  upload/admin/view/template/localisation/geo_zone*.twig,\
  upload/admin/controller/localisation/tax_class.php,\
  upload/admin/model/localisation/tax_class.php,\
  upload/admin/view/template/localisation/tax_class*.twig,\
  upload/admin/controller/localisation/tax_rate.php,\
  upload/admin/model/localisation/tax_rate.php,\
  upload/admin/view/template/localisation/tax_rate*.twig,\
  upload/admin/controller/tool/log.php,\
  upload/admin/view/template/tool/log.twig,\
  upload/system/library/log.php

sonar.exclusions=upload/system/storage/vendor/**,upload/image/**,upload/install/**

# Las pruebas se declaran aparte para que no cuenten como codigo de produccion
sonar.tests=tests,e2e
sonar.test.inclusions=tests/**/*.php,e2e/**/*.ts,e2e/**/*.js,e2e/**/*.feature

# Cobertura de las pruebas PHPUnit (tests/unit), generada con pcov:
#   cd tests/unit && php -d pcov.enabled=1 -d pcov.directory=../../upload \
#     vendor/bin/phpunit --coverage-clover evidencia/cobertura/clover.xml
sonar.php.coverage.reportPaths=tests/unit/evidencia/cobertura/clover.xml,tests/andres/evidencia/cobertura/clover.xml

# La cobertura se mide solo donde hay pruebas PHPUnit: las plantillas Twig y los
# archivos que se prueban por API/E2E (Vitest, Serenity, Cypress) no generan
# cobertura de lineas PHP, asi que se aislan de esta metrica.
sonar.coverage.exclusions=\
  **/*.twig,\
  upload/admin/model/catalog/review.php,\
  upload/admin/model/marketing/coupon.php,\
  upload/admin/model/sale/returns.php,\
  upload/catalog/controller/account/returns.php,\
  upload/catalog/controller/product/compare.php,\
  upload/catalog/controller/product/search.php,\
  upload/catalog/controller/checkout/cart.php,\
  upload/extension/opencart/catalog/controller/checkout/coupon.php,\
  upload/admin/controller/marketing/coupon.php,\
  upload/catalog/model/catalog/review.php,\
  upload/admin/controller/catalog/review.php,\
  upload/catalog/model/account/returns.php,\
  upload/admin/controller/sale/returns.php,\
  upload/admin/controller/sale/order.php,\
  upload/admin/controller/localisation/language.php,\
  upload/admin/controller/localisation/currency.php,\
  upload/admin/controller/localisation/geo_zone.php,\
  upload/admin/controller/localisation/tax_class.php,\
  upload/admin/controller/localisation/tax_rate.php,\
  upload/admin/controller/tool/log.php

# Duplicacion: los controladores y modelos CRUD del panel admin y las plantillas
# repiten por diseno la misma estructura de OpenCart (listar, formulario,
# guardar, borrar). No se mide como duplicacion propia.
sonar.cpd.exclusions=upload/admin/**,**/*.twig,\
  upload/catalog/model/catalog/product.php,\
  upload/catalog/controller/product/search.php,\
  upload/catalog/controller/account/returns.php,\
  upload/catalog/controller/checkout/cart.php,\
  upload/system/library/cart/cart.php,\
  upload/catalog/controller/product/compare.php

# Avisos que no se corrigen a proposito (justificacion):
#  - S5256 (tabla sin <th>): las pruebas de regresion leen ese HTML con <td>;
#    cambiarlo rompe pruebas que protegen el comportamiento. Son tablas de maquetacion.
#  - S4645 (comentario //--> dentro de <script>): patron heredado de OpenCart.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4
sonar.issue.ignore.multicriteria.e1.ruleKey=Web:S5256
sonar.issue.ignore.multicriteria.e1.resourceKey=upload/admin/view/template/sale/order_info.twig
sonar.issue.ignore.multicriteria.e2.ruleKey=Web:S5256
sonar.issue.ignore.multicriteria.e2.resourceKey=upload/catalog/view/template/product/review_list.twig
sonar.issue.ignore.multicriteria.e3.ruleKey=Web:S5256
sonar.issue.ignore.multicriteria.e3.resourceKey=upload/catalog/view/template/product/compare.twig
sonar.issue.ignore.multicriteria.e4.ruleKey=Web:S4645
sonar.issue.ignore.multicriteria.e4.resourceKey=upload/catalog/view/template/product/search.twig

# Nota de transparencia: la duplicacion de catalog/ (product.php, search.php, returns.php,
# cart.php, compare.php) viene del codigo original de OpenCart 4.1.0.3 y no se refactoriza
# (se prueban en rojo para documentar defectos, sin corregir el codigo). En cobertura se
# aislan los archivos que se prueban por API/E2E y no por PHPUnit (modelos admin de cupones,
# reseñas y devoluciones; controladores de devoluciones y comparar).
